name: l1 bisect
on:
  workflow_dispatch:
jobs:
  helper:
    strategy:
      fail-fast: false
      matrix:
        tree: [payload/l1, payload-control/payload/l1]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: helper Windows tests
        shell: pwsh
        working-directory: ${{ matrix.tree }}
        run: |
          $env:BRAIN_NO_WRANGLER_LOGIN = '1'
          node --test --test-reporter=spec test/helper.win.test.mjs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\out.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
