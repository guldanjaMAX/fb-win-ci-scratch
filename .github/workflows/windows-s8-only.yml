name: Windows S8 only
run-name: S8 diagnostic ${{ inputs.expected_revision }}

"on":
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Reviewed scratch revision (40 hex characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: s8-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  s8:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Require exact reviewed dispatch revision
        shell: powershell
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Only the reviewed scratch default branch is authorized' }
          if ($env:EXPECTED_REVISION -notmatch '^[0-9a-f]{40}$') { throw 'Expected revision must be a full SHA' }
          if ($env:GITHUB_SHA -ne $env:EXPECTED_REVISION) { throw 'Dispatch revision changed; diagnostic not run' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require reviewed payload and Windows PowerShell 5.1 Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSEdition -ne 'Desktop') { throw 'Windows PowerShell 5.1 Desktop required' }
          $expected = @{
            'payload/l1/fb-store.mjs' = 'd30c7997d8bf17ae92402ef18641c0b82ab3e14b3ef8b83f240da7e456dc5b78'
            'payload/l4/windows-store-pull.mjs' = '60f2f33f142a81f7df46b26ae21e22e3128706cd7042a020530f657a27d4bd9e'
            'payload/s8-fix/store-action-pipes.test.mjs' = '12c87c56bafdb43c76996e3fdd7a41492486dd65c4b7fba9073368b0d5f6db00'
            'payload/s8-fix/store-action-diagnostic.mjs' = '097e114343ebe318e332f34664f4dad4ea36d00598a75a1165b507fec53df9bc'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            if ((Get-FileHash $entry.Key -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.Value) { throw "payload hash mismatch: $($entry.Key)" }
          }
      - name: Run one bounded synthetic diagnostic
        shell: powershell
        env:
          BRAIN_NO_WRANGLER_LOGIN: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $env:HELPER_PATH = (Resolve-Path '.\payload\l1\fb-store.mjs').Path
          node .\payload\s8-fix\store-action-diagnostic.mjs --run --out .\ci-out\s8-diagnostic
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic stopped at first failure; inspect retained phases and counts' }
      - name: Bound diagnostic artifact storage
        id: artifact_cap
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = 0
          if (Test-Path '.\ci-out\s8-diagnostic') {
            $total = Get-ChildItem '.\ci-out\s8-diagnostic' -File -Recurse | Measure-Object -Property Length -Sum
            $bytes = [long]$total.Sum
          }
          if ($bytes -gt 10485760) { throw 'Raw artifact exceeds approved 10 MiB cap; upload refused' }
          'within_limit=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.artifact_cap.outputs.within_limit == 'true'
        with:
          name: windows-s8-diagnostic-raw-results
          path: ci-out/s8-diagnostic
          if-no-files-found: warn
          retention-days: 3
