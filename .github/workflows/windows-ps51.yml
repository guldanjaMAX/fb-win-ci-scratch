name: Windows PowerShell 5.1

"on":
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require Windows PowerShell 5.1 Desktop
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { Write-Host "::error::PowerShell major is not 5"; exit 1 }
          if ($PSVersionTable.PSEdition -ne 'Desktop') { Write-Host "::error::PowerShell edition is not Desktop"; exit 1 }
      - name: Run Windows checks
        shell: powershell
        env:
          WCI: '1'
        run: |
          node --test ci/slim-artifact.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ci/wci-run.mjs --out ci-out
      - name: Prepare slim review artifact
        if: always()
        shell: powershell
        run: node ci/slim-artifact.mjs --source ci-out --out ci-artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-ps51-results
          path: ci-artifact
          retention-days: 3
